# hypermnesia -- single-box stack: Postgres+pgvector, TEI embedder, optional reranker.
#
# Every published port binds to 127.0.0.1 unless BIND_ADDR says otherwise. Docker's plain
# `HOST:CONTAINER` form means 0.0.0.0, and none of these three services should be reachable
# from the network by default: Postgres holds the personal-memory store, and neither the
# embedder nor the reranker has any authentication at all.
#   docker compose up -d                      # Postgres + embedder
#   docker compose --profile rerank up -d     # + cross-encoder reranker
# Then load the schema (see docs/INSTALL.md section B).
services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hypermnesia}
    ports: ["${BIND_ADDR:-127.0.0.1}:${PG_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hm} -d ${POSTGRES_DB:-hypermnesia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # bge-m3 embeddings (CPU by default). For GPU, add a `deploy.resources` reservation
  # or use the tei cuda image and an nvidia runtime.
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    command: ["--model-id", "BAAI/bge-m3", "--port", "80",
              "--auto-truncate", "--max-batch-tokens", "4096"]
    ports: ["${BIND_ADDR:-127.0.0.1}:${TEI_PORT:-8080}:80"]
    volumes:
      - tei-cache:/data
    environment:
      OMP_NUM_THREADS: ${TEI_THREADS:-4}

  # Optional cross-encoder reranker (torch, CPU wheel by default; for GPU see rerank/Dockerfile).
  reranker:
    profiles: ["rerank"]
    build:
      context: ../../rerank
    ports: ["${BIND_ADDR:-127.0.0.1}:${RERANK_PORT:-8091}:8091"]
    environment:
      RERANK_MODEL: BAAI/bge-reranker-v2-m3
      RERANK_IDLE_SEC: ${RERANK_IDLE_SEC:-600}
      # 0.0.0.0 INSIDE the container, which is not the same as on the host: the server
      # defaults to 127.0.0.1, and inside a container that means "this container only", so the
      # published port would refuse every connection -- and search fails OPEN to plain RRF, so
      # you would get unreranked results while believing you were reranking.
      #
      # What actually decides exposure is the host side of `ports:` above, which is why every
      # one of them is pinned to 127.0.0.1 by default. This endpoint has no authentication;
      # setting BIND_ADDR to anything else puts it, Postgres and the embedder on that network.
      HM_RERANK_BIND: 0.0.0.0
    volumes:
      - hf-cache:/root/.cache/huggingface

volumes:
  pgdata:
  tei-cache:
  hf-cache:
