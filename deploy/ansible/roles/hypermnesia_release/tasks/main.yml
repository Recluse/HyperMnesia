---
- name: Release | Refuse a floating source revision
  ansible.builtin.assert:
    that:
      - hypermnesia_version | length > 0
      - hypermnesia_version not in ['HEAD', 'main', 'master']
    fail_msg: >-
      hypermnesia_version must be an immutable commit or release tag. A branch can move between
      two hosts in the same play, which is a surprisingly efficient way to install two versions.

- name: Release | Create the source parent
  ansible.builtin.file:
    path: "{{ hypermnesia_source_dir | dirname }}"
    state: directory
    owner: "{{ hypermnesia_user }}"
    mode: "0700"

- name: Release | Check out the pinned source
  ansible.builtin.git:
    repo: "{{ hypermnesia_repo_url }}"
    dest: "{{ hypermnesia_source_dir }}"
    version: "{{ hypermnesia_version }}"
    update: true
    force: false
  become: true
  become_user: "{{ hypermnesia_user }}"

- name: Release | Resolve the installed commit
  ansible.builtin.command:
    argv: [git, -C, "{{ hypermnesia_source_dir }}", rev-parse, "{{ hypermnesia_version }}^{commit}"]
  register: hypermnesia_release_commit
  changed_when: false
  when: not ansible_check_mode
  become: true
  become_user: "{{ hypermnesia_user }}"

- name: Release | Require an exact commit in check mode
  ansible.builtin.assert:
    that: hypermnesia_version is match('^[0-9a-fA-F]{40}$')
    fail_msg: Check mode needs a full 40-character commit SHA because it does not create a checkout.
  when: ansible_check_mode

- name: Release | Select the requested commit
  ansible.builtin.set_fact:
    hypermnesia_release_sha: >-
      {{ hypermnesia_version | lower if ansible_check_mode else hypermnesia_release_commit.stdout }}

- name: Release | Read the current release marker
  ansible.builtin.command:
    argv: [awk, -F=, '$1 == "commit" {print $2}', "{{ hypermnesia_home }}/current/RELEASE"]
  register: hypermnesia_current_release
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: "{{ hypermnesia_user }}"

- name: Release | Install the pinned commit
  ansible.builtin.command:
    argv: >-
      {{
        [hypermnesia_source_dir ~ '/hm', 'install', '--ref', hypermnesia_release_sha,
         '--keep', hypermnesia_keep_releases | string, '--prune-age',
         hypermnesia_prune_age_days | string]
        + (['--mcp-binary', hypermnesia_mcp_binary] if hypermnesia_mcp_binary | length else [])
        + (['--console=' ~ hypermnesia_console_features] if hypermnesia_install_console else [])
        + (['--wire'] if hypermnesia_wire_existing_configs else [])
      }}
  environment:
    HYPERMNESIA_HOME: "{{ hypermnesia_home }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - hypermnesia_current_release.rc != 0 or
      hypermnesia_current_release.stdout | trim != hypermnesia_release_sha[:12]
  become: true
  become_user: "{{ hypermnesia_user }}"

- name: Release | Verify the published marker
  ansible.builtin.command:
    argv: [awk, -F=, '$1 == "commit" {print $2}', "{{ hypermnesia_home }}/current/RELEASE"]
  register: hypermnesia_published_release
  changed_when: false
  when: not ansible_check_mode
  become: true
  become_user: "{{ hypermnesia_user }}"

- name: Release | Assert the published commit
  ansible.builtin.assert:
    that: hypermnesia_published_release.stdout | trim == hypermnesia_release_sha[:12]
  when: not ansible_check_mode
