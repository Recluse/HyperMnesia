name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax check (compile all)
        run: python -m compileall -q ingest hooks rerank ci
      - name: Lint (real errors only -- undefined names, syntax)
        run: |
          pip install --quiet ruff
          ruff check --select E9,F63,F7,F82 ingest hooks rerank ci
      - name: GRAPH_SQL parity (hook copy vs Rust source of truth)
        run: python ci/check_graph_sql_parity.py
      - name: Hook I/O contract (hooks are fail-open, so a broken contract is silent)
        run: python tests/test_hook_contract.py
      - name: Incremental ingest (a silent fallback to full replace only costs embeddings)
        run: python tests/test_incremental_ingest.py
      - name: Ingest enumeration (an empty ingest deletes the corpus it should have refreshed)
        run: python tests/test_ingest_enumeration.py
      - name: Query hygiene (a split hostname matches nothing, and nothing says so)
        run: python tests/test_query_hygiene.py
      - name: Glob parity (the hook must inject exactly what get_constraints returns)
        run: python tests/test_glob_parity.py
      - name: Doctor (the health check must not call a broken store healthy)
        run: python tests/test_doctor.py
      - name: hm ingest (a re-ingest must not silently drop every embedding)
        run: python tests/test_hm_cli.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the MCP server
        working-directory: mcp-server
        run: cargo build --release --locked
      - name: Rust unit tests (glob parity with the Python hook)
        working-directory: mcp-server
        run: cargo test --locked

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_USER: hm
          POSTGRES_PASSWORD: hm
          POSTGRES_DB: hypermnesia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hm -d hypermnesia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: hm
    steps:
      - uses: actions/checkout@v4
      - name: Load schemas
        run: |
          psql -h localhost -U hm -d hypermnesia -v ON_ERROR_STOP=1 -f sql/schema.sql
          psql -h localhost -U hm -d hypermnesia -v ON_ERROR_STOP=1 -f sql/schema_mem.sql
      - name: Load the example seed + assert Tier-1 resolves
        run: |
          psql -h localhost -U hm -d hypermnesia -v ON_ERROR_STOP=1 -f examples/seed_example.sql
          psql -h localhost -U hm -d hypermnesia -tAc \
            "SELECT count(*) FROM components WHERE repo='myapp'" | grep -qx 4
          psql -h localhost -U hm -d hypermnesia -tAc \
            "SELECT count(*) FROM constraints WHERE repo='myapp'" | grep -qx 2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Golden -- the hook's GRAPH_SQL is valid and returns the seed shape
        run: |
          # Run the exact query the PreToolUse hook uses; assert it loads the map (not just that
          # the tables have rows). Catches an invalid/renamed column the string-parity check can't.
          python ci/check_graph_sql_parity.py --print > /tmp/graph.sql
          psql -h localhost -U hm -d hypermnesia -v ON_ERROR_STOP=1 -tAf /tmp/graph.sql > /tmp/graph.json
          python -c "import json; g=json.load(open('/tmp/graph.json')); c={x['slug'] for x in g['components'] if x['repo']=='myapp'}; assert {'myapp-api','myapp-db','myapp-docs','myapp-root'}<=c, c; assert any(x['scope']=='global' and x['severity']=='must' for x in g['constraints']), 'seed global must missing'; print('GRAPH_SQL golden OK:', sorted(c))"
