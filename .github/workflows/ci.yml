name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax check (compile all)
        run: python -m compileall -q ingest hooks rerank ci eval
      - name: Lint (real errors only -- undefined names, syntax)
        run: |
          pip install --quiet ruff
          ruff check --select E9,F63,F7,F82 ingest hooks rerank ci eval
      - name: GRAPH_SQL parity (hook copy vs Rust source of truth)
        run: python ci/check_graph_sql_parity.py
      - name: Hook I/O contract (hooks are fail-open, so a broken contract is silent)
        run: python tests/test_hook_contract.py
      - name: Incremental ingest (a silent fallback to full replace only costs embeddings)
        run: python tests/test_incremental_ingest.py
      - name: Ingest enumeration (an empty ingest deletes the corpus it should have refreshed)
        run: python tests/test_ingest_enumeration.py
      - name: Ingest redaction (a secret in a runbook becomes a chunk, a vector and a prompt)
        run: python tests/test_ingest_redaction.py
      - name: Query hygiene (a split hostname matches nothing, and nothing says so)
        run: python tests/test_query_hygiene.py
      - name: Glob parity (the hook must inject exactly what get_constraints returns)
        run: python tests/test_glob_parity.py
      - name: Doctor (the health check must not call a broken store healthy)
        run: python tests/test_doctor.py
      - name: hm ingest (a re-ingest must not silently drop every embedding)
        run: python tests/test_hm_cli.py
      - name: Chunker (nothing may exceed what the embedder can embed whole)
        run: python tests/test_chunker.py
      - name: Latency statistics (no store needed)
        run: python ci/latency.py --selfcheck
      - name: Settings knobs must name files that exist and variables the code reads
        run: python tests/test_settings_knobs.py
      - name: Shared settings file (prefix allowlist, mode check, env precedence)
        run: python tests/test_env_file.py
      # The consolidator rewrites memory in place: one bad grouping can retire hundreds of
      # records in a single verdict, which is exactly what it did before this guard existed.
      - name: Consolidator grouping (a chain must not become one group)
        run: python tests/test_consolidate_groups.py
      - name: Memory perspectives and author-owned entities
        run: python tests/test_entity_ownership.py && python tests/test_memory_perspectives.py
      - name: Memory evidence and peer cards
        run: python tests/test_memory_evidence.py && python tests/test_peer_cards.py
      - name: Bounded context and automatic depth
        run: python tests/test_memory_context.py && python tests/test_auto_depth_eval.py
      - name: Review-gated Dreamer and grounded Dialectic
        run: python tests/test_dreamer.py && python tests/test_dialectic.py
      - name: Public model prompts are English
        run: python tests/test_prompt_language.py
      # Reserved metadata decides which layer a memory is cited from. A caller that can set it
      # can pass an unreviewed write off as an approved Dreamer conclusion.
      - name: Reserved write fields and merge perspective
        run: python tests/test_write_trust.py
      - name: Maintenance locks (atomic, stale after reboot PID reuse)
        run: python tests/test_maintenance_locks.py
      - name: Knowledge pages (sibling tag, chunking, publish SQL)
        run: python tests/test_mem_pages.py
      - name: Extraction queue (claims, failures exit non-zero, author gate)
        run: python tests/test_mem_extract_queue.py
      - name: Ingest ignore file
        run: python tests/test_ingest_ignore.py
      # Hooks, jobs and the MCP server run from an installed commit, not from a checkout; the
      # state moves out of ~/.claude exactly once and is never split between the two places.
      - name: Installed release and the state/settings rule (throwaway HOME)
        run: python tests/test_hm_home.py && python tests/test_install.py
      # The fixture is shared with `cargo test`: both resolvers must pick the same components.
      - name: Tier-1 parity fixture (Python side) and hook root resolution
        run: python tests/test_tier1_parity.py && python tests/test_arch_hook_root.py
      # Four modules ship an executable self-check and only one of them was run. For each of
      # the three below, that self-check is the ONLY automated coverage its behaviour has:
      # Tier-1 selection (specificity order, 1-hop propagation, cross-repo isolation),
      # secret redaction, and the novelty gate with its negation guard. A change that leaked
      # another repo's constraints or broke a redaction pattern passed everything else green.
      - name: Tier-1 selection (1-hop propagation and cross-repo isolation)
        run: python hooks/_arch.py
      - name: Secret redaction patterns
        run: python ingest/_redact.py
      - name: Novelty gate and its negation guard
        run: python hooks/mem_extract.py --selfcheck

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the MCP server
        working-directory: mcp-server
        run: cargo build --release --locked
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Project status (source hashes, scope and real MCP transport)
        run: python tests/test_project_status.py
      - name: Rust unit tests (glob parity with the Python hook)
        working-directory: mcp-server
        run: cargo test --locked
      # The console is a separate crate: its own build and its own tests. Kept in the same job
      # because it shares the toolchain, and a console that does not compile is a console nobody
      # notices is broken until they try to open it.
      #
      # On this runner that means the data layer and the four command-line tools with the default
      # feature set: the tray's GUI dependencies are declared for macOS unconditionally, and for
      # Linux only behind the `tray` feature (off by default), specifically so this step needs no
      # GUI library at all. Everything the tests cover here is in the part that builds without it.
      - name: Build the console (data layer + CLI tools; no GUI libraries needed)
        working-directory: console
        run: cargo build --release --locked
      - name: Console unit tests
        working-directory: console
        run: cargo test --locked
      # The console, the hooks and the MCP server must name one settings file; this compares the
      # built console against the Python loader, expanduser cases included.
      - name: Console and hooks agree on the home and the settings file
        env:
          HM_REQUIRE_CONSOLE: "1"
        run: python tests/test_hm_home.py
      # The Linux tray, behind its feature: exercises the `tray-icon` + GTK path this runner does
      # not otherwise touch. Its own dependencies need real headers, hence the apt step -- and
      # that step is confined to here so the two steps above stay proof that nothing else in this
      # crate needs them.
      - name: Build the Linux tray (GTK + appindicator)
        working-directory: console
        run: |
          sudo apt-get update
          # libxdo-dev is easy to miss: tray-icon's menu-accelerator handling links -lxdo, and the
          # link fails without it even though nothing above mentions xdo by name.
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          cargo build --release --locked --features tray
      - name: Linux tray unit tests
        working-directory: console
        run: cargo test --locked --features tray

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_USER: hm
          POSTGRES_PASSWORD: hm
          POSTGRES_DB: hypermnesia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hm -d hypermnesia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: hm
    steps:
      - uses: actions/checkout@v4
      # The one apply order lives in ./hm; nothing here keeps a copy of it. Twice, because the
      # second run is the claim: every file recorded with its checksum, nothing re-applied.
      - name: Migrate (hm migrate) -- and again, which must be a no-op
        env:
          DATABASE_URL: postgresql://hm:hm@localhost:5432/hypermnesia
        run: |
          ./hm migrate --owner ci
          second=$(./hm migrate --owner ci)
          echo "$second"
          echo "$second" | grep -q "nothing to apply"
      # The application role gets a password only here, in a throwaway database. Everything
      # below that claims something about isolation connects AS hm_app or as a per-author
      # login: the owner bypasses every policy, so a check run as the owner proves nothing.
      - name: Give hm_app a password for the live tests
        run: psql -h localhost -U hm -d hypermnesia -v ON_ERROR_STOP=1 -c "ALTER ROLE hm_app PASSWORD 'hm_app'"
      - name: Load the example seed + assert Tier-1 resolves
        run: |
          psql -h localhost -U hm -d hypermnesia -v ON_ERROR_STOP=1 -f examples/seed_example.sql
          psql -h localhost -U hm -d hypermnesia -tAc \
            "SELECT count(*) FROM components WHERE repo='myapp'" | grep -qx 4
          psql -h localhost -U hm -d hypermnesia -tAc \
            "SELECT count(*) FROM constraints WHERE repo='myapp'" | grep -qx 2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Golden -- the hook's GRAPH_SQL is valid and returns the seed shape
        run: |
          # Run the exact query the PreToolUse hook uses; assert it loads the map (not just that
          # the tables have rows). Catches an invalid/renamed column the string-parity check can't.
          python ci/check_graph_sql_parity.py --print > /tmp/graph.sql
          psql -h localhost -U hm -d hypermnesia -v ON_ERROR_STOP=1 -tAf /tmp/graph.sql > /tmp/graph.json
          python -c "import json; g=json.load(open('/tmp/graph.json')); c={x['slug'] for x in g['components'] if x['repo']=='myapp'}; assert {'myapp-api','myapp-db','myapp-docs','myapp-root'}<=c, c; assert any(x['scope']=='global' and x['severity']=='must' for x in g['constraints']), 'seed global must missing'; print('GRAPH_SQL golden OK:', sorted(c))"
      # Nothing in CI executed a single mem.* statement, so abstention and
      # supersede-not-overwrite -- both headline claims -- were asserted only by a probe that
      # needs a live embedder and therefore never ran. This needs no embedder: pgvector takes a
      # literal vector, which isolates the SQL and the view from the model.
      - name: Memory SQL contract (the view hides what it promises, the gate abstains)
        env:
          DATABASE_URL: postgresql://hm:hm@localhost:5432/hypermnesia
          HM_APP_URL: postgresql://hm_app:hm_app@localhost:5432/hypermnesia
        run: python tests/test_memory_sql.py
      # Two readers on the shared login, two per-author logins that try to read and write as
      # each other, the definer functions, the author directory, and hm migrate refusing an
      # edited file.
      - name: Row-level security and enforced identity, as the roles that use them
        env:
          DATABASE_URL: postgresql://hm:hm@localhost:5432/hypermnesia
          HM_APP_URL: postgresql://hm_app:hm_app@localhost:5432/hypermnesia
        run: python tests/test_rls_live.py
      - name: Memory lifecycle, live (one merge path, two time axes, live premises)
        env:
          DATABASE_URL: postgresql://hm:hm@localhost:5432/hypermnesia
        run: |
          pip install --quiet psycopg2-binary
          python tests/test_memory_lifecycle_live.py
      # Builds its own scratch databases (the CI owner may CREATE DATABASE) and runs the
      # lifecycle migration over rows in the shapes the old code wrote.
      - name: Memory lifecycle migration over legacy rows
        env:
          DATABASE_URL: postgresql://hm:hm@localhost:5432/hypermnesia
        run: python tests/test_memory_lifecycle_migration_live.py
      - name: Tier 1 and constraint sources, live
        env:
          DATABASE_URL: postgresql://hm:hm@localhost:5432/hypermnesia
        run: python tests/test_arch_live.py
