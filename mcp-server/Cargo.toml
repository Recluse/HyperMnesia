[package]
name = "hypermnesia-mcp"
version = "0.1.0"
edition = "2021"
description = "HyperMnesia MCP server: Tier 0/1 project map + constraints + doc/memory search"

[[bin]]
name = "hypermnesia-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
opt-level = 2
