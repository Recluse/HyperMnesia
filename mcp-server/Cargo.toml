[package]
name = "hypermnesia-mcp"
version = "0.2.0"
edition = "2021"
description = "HyperMnesia MCP server: project knowledge and scoped long-term memory"

[[bin]]
name = "hypermnesia-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
opt-level = 2
