[package]
name = "hypermnesia-console"
version = "0.1.0"
edition = "2021"
description = "Menu-bar console for a HyperMnesia store: volumes, scheduled jobs, settings"
license = "MIT"

[dependencies]

# The data layer has no dependencies at all: a console that takes a minute to build is a console
# nobody rebuilds.

# Two dependencies in the whole crate, only the tray binary uses them, and only on macOS -- which
# is where the tray belongs anyway, since the schedules it reads are launchd's. Declaring them
# per-target keeps the command-line tools buildable on a machine with no GUI libraries at all,
# which is what CI is. A menu, not a window: everything this console has to show is a dozen lines
# and a dozen buttons, and a window would mean a GUI framework for the same result.
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.25"
winit = "0.30"

# The Linux tray, behind a feature and off by default -- for the same reason the macOS deps are
# per-target: the data layer and the four command-line tools must keep building on a machine with
# no GUI libraries at all, which is what CI's bare runner is. `tray-icon` drives the same crate as
# macOS, through `libayatana-appindicator`; on Linux it needs a GTK main loop rather than winit's,
# so `gtk` is a dependency here and `winit` is not.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.25", optional = true }
gtk = { version = "0.18", optional = true }
glib = { version = "0.18", optional = true }

[features]
tray = ["dep:tray-icon", "dep:gtk", "dep:glib"]

[[bin]]
name = "hypermnesia-stats"
path = "src/bin/stats.rs"

[[bin]]
name = "hypermnesia-jobs"
path = "src/bin/jobs.rs"

[[bin]]
name = "hypermnesia-settings"
path = "src/bin/settings.rs"

[[bin]]
name = "hypermnesia-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "hypermnesia"
path = "src/bin/tray.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
